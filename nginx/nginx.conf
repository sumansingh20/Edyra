worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
      text/plain text/css text/xml text/javascript
      application/json application/javascript application/xml
      application/rss+xml application/atom+xml
      image/svg+xml font/woff2;

    # ── WebSocket upgrade map (Socket.io) ────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # ── Upstreams ──────────────────────────────────────────
    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Main server block ──────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl http2;   # Uncomment for SSL
        server_name localhost;

        # ── SSL (uncomment + fill in for production) ────────
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_session_timeout 1d;
        # ssl_session_cache   shared:SSL:50m;
        # ssl_session_tickets off;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_prefer_server_ciphers off;
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # ── Security headers ────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
          "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:;"
          always;

        client_max_body_size 25M;

        # ── API routes ──────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 60s;
            proxy_send_timeout    90s;
            proxy_read_timeout    90s;
        }

        # ── Auth rate limiting (stricter) ───────────────────
        location ~ ^/api/auth/(login|register|forgot-password) {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── File upload endpoint ────────────────────────────
        location /api/upload/ {
            limit_req zone=upload_limit burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            client_max_body_size    25M;
            proxy_connect_timeout   120s;
            proxy_send_timeout      120s;
            proxy_read_timeout      120s;
            proxy_request_buffering off;
        }

        # ── Uploaded static files (served from backend) ────
        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            7d;
            add_header         Cache-Control "public, max-age=604800";
        }

        # ── Socket.io WebSocket ──────────────────────────────
        # Uses $connection_upgrade map for proper HTTP upgrade
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_connect_timeout 60s;
            proxy_buffering     off;
        }

        # ── Health check ─────────────────────────────────────
        location = /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # ── Next.js static assets ────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        location /_next/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Frontend (Next.js) ────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        # ── Static asset caching ──────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Error pages ───────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
